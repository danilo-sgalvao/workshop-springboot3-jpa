# =============================================
# Perfil de produção — usa PostgreSQL real
#
# PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
# são injetados automaticamente pelo Railway quando
# um banco PostgreSQL é adicionado ao projeto.
# No docker-compose.yml, elas são definidas manualmente.
# =============================================

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# SQL no console desativado em producao
spring.jpa.show-sql=false
